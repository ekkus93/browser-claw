name: Apply BrowserClaw Formatters Once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-formatters-once.yml'

permissions:
  contents: write

concurrency:
  group: browserclaw-apply-formatters-once
  cancel-in-progress: false

jobs:
  format:
    name: Apply first-party source formatters
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Apply formatters
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            scripts/postbuild.mjs \
            scripts/validate-release-config.mjs \
            scripts/verify-release-artifacts.mjs \
            src/config/buildMetadata.ts \
            vite.config.ts
          cargo fmt --all
          pnpm run format:check
          cargo fmt --all -- --check
          git diff --check
      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatter changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            scripts/postbuild.mjs \
            scripts/validate-release-config.mjs \
            scripts/verify-release-artifacts.mjs \
            src/config/buildMetadata.ts \
            vite.config.ts \
            crates
          git commit -m 'style: apply BrowserClaw source formatters'
          git push origin HEAD:master
