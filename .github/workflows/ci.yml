name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10'
  NODE_VERSION: '22'
  WASM_PACK_VERSION: '0.13.1'
  CARGO_AUDIT_VERSION: '0.22.2'

jobs:
  workflow-lint:
    name: GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: actionlint -color

  release-config:
    name: Release configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:release-config

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/scan_release_secrets.py --self-test
      - run: python3 scripts/scan_release_secrets.py --working-tree --git-history

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked
      - name: Audit Rust dependencies
        run: cargo audit

  typecheck:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  lint-format:
    name: Lint + Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject focused tests
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '\.(only)\s*\(' -- '*.test.ts' '*.test.tsx' '*.spec.ts' '*.spec.tsx'; then
            echo 'Focused test marker detected.' >&2
            exit 1
          fi
      - run: pnpm exec vitest run --no-file-parallelism

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm run test:e2e
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.sha }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

  cargo:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build:
    name: Build and package RC artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify clean exact-SHA checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version "${WASM_PACK_VERSION}" --locked
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record release toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          rustc --version
          cargo --version
          wasm-pack --version
          pnpm exec playwright --version
          docker --version
      - name: Set exact-SHA RC dry-run metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'VITE_RELEASE_VERSION=0.1.0'
            echo "VITE_GIT_SHA=${GITHUB_SHA}"
            echo "VITE_BUILD_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo 'VITE_RELEASE_CHANNEL=rc'
            echo 'VITE_BASE_PATH=/browser-claw/'
            echo 'VITE_CHROME_EXTENSION_ID=mgobfbgnjfnlpahiniaincgpkinnodka'
            echo 'VITE_DEMO_MODE=false'
            echo 'VITE_ALLOW_REFERENCE_RUNTIME_FALLBACK=false'
            echo 'VITE_ALLOW_MOCK_PROVIDER=false'
          } >> "${GITHUB_ENV}"
      - run: pnpm run build:wasm
      - name: Verify generated bindings did not drift
        run: git diff --exit-code
      - run: pnpm run build:release
      - name: Package deterministic RC archives
        run: GITHUB_REF_NAME=v0.1.0-rc.1 pnpm run package:release
      - run: pnpm run verify:release-artifacts
      - name: Scan release artifacts for credentials
        run: python3 scripts/scan_release_secrets.py --path release-artifacts
      - name: Verify tracked tree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload exact-SHA RC dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browserclaw-rc-dry-run-${{ github.sha }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  extension-e2e:
    name: Extension E2E (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:extension:e2e:docker

  release:
    name: Release
    needs:
      - workflow-lint
      - release-config
      - secret-scan
      - dependency-audit
      - typecheck
      - lint-format
      - unit-tests
      - e2e
      - cargo
      - build
      - extension-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify clean exact-tag checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version "${WASM_PACK_VERSION}" --locked
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record release toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          rustc --version
          cargo --version
          wasm-pack --version
          pnpm exec playwright --version
          docker --version
      - name: Set immutable release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == *-rc.* ]]; then
            channel=rc
          else
            channel=stable
          fi
          build_utc="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo 'VITE_RELEASE_VERSION=0.1.0'
            echo "VITE_GIT_SHA=${GITHUB_SHA}"
            echo "VITE_BUILD_UTC=${build_utc}"
            echo "VITE_RELEASE_CHANNEL=${channel}"
            echo 'VITE_BASE_PATH=/browser-claw/'
            echo 'VITE_CHROME_EXTENSION_ID=mgobfbgnjfnlpahiniaincgpkinnodka'
            echo 'VITE_DEMO_MODE=false'
            echo 'VITE_ALLOW_REFERENCE_RUNTIME_FALLBACK=false'
            echo 'VITE_ALLOW_MOCK_PROVIDER=false'
          } >> "${GITHUB_ENV}"
      - run: pnpm run build:wasm
      - name: Verify generated bindings did not drift
        run: git diff --exit-code
      - run: pnpm run build:release
      - run: pnpm run package:release
      - run: pnpm run verify:release-artifacts
      - name: Scan release artifacts for credentials
        run: python3 scripts/scan_release_secrets.py --path release-artifacts
      - name: Verify tracked tree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Attach gate evidence when present
        shell: bash
        run: |
          set -euo pipefail
          evidence='docs/BROWSERCLAW_RELEASE_CANDIDATE_0.1.0_GATE_EVIDENCE.md'
          if [[ -f "${evidence}" ]]; then
            cp "${evidence}" release-artifacts/
          fi
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: release-artifacts/*
