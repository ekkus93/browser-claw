name: Repair React Test Warnings Once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-react-test-warnings-once.yml'

permissions:
  contents: write

concurrency:
  group: browserclaw-fix-react-test-warnings-once
  cancel-in-progress: true

jobs:
  repair:
    name: Apply React test warning repairs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply source-level repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path: str, replacements: list[tuple[str, str]]) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              file.write_text(text, encoding='utf-8')

          patch('src/screens/ModelsScreen.test.tsx', [
              ("import { render, screen, waitFor, within } from '@testing-library/react';", "import { cleanup, render, screen, waitFor, within } from '@testing-library/react';"),
              ("afterEach(async () => {\n  vi.unstubAllGlobals();", "afterEach(async () => {\n  cleanup();\n  vi.unstubAllGlobals();"),
          ])
          patch('src/screens/SettingsScreen.test.tsx', [
              ("import { act, render, screen, waitFor } from '@testing-library/react';", "import { act, cleanup, render, screen, waitFor } from '@testing-library/react';"),
              ("  afterEach(async () => {\n    await db.app_settings.clear();", "  afterEach(async () => {\n    cleanup();\n    await db.app_settings.clear();"),
          ])
          patch('src/screens/SecurityScreen.test.tsx', [
              ("import { render, screen, waitFor } from '@testing-library/react';", "import { cleanup, render, screen, waitFor } from '@testing-library/react';"),
              ("afterEach(() => {\n  // Clear plaintext + the 15-min auto-lock timer between tests.\n  secretVault.lock();", "afterEach(() => {\n  cleanup();\n  // Clear plaintext + the 15-min auto-lock timer between tests.\n  secretVault.lock();"),
          ])
          patch('src/screens/ChatScreen.test.tsx', [
              ("import { render, screen, waitFor } from '@testing-library/react';", "import { act, render, screen, waitFor } from '@testing-library/react';"),
              ("    store.dispatch(\n      chatErrored({ kind: 'cors', message: 'Blocked by the browser (CORS).' }),\n    );", "    act(() => {\n      store.dispatch(\n        chatErrored({ kind: 'cors', message: 'Blocked by the browser (CORS).' }),\n      );\n    });"),
              ("    store.dispatch(\n      approvalRequested({\n        id: 'a1',\n        kind: 'tool_call',\n        title: 'Write file',\n        risk: 'high',\n        summary: 'writes a file',\n        payloadPreview: '{\"path\":\"/x\"}',\n      }),\n    );", "    act(() => {\n      store.dispatch(\n        approvalRequested({\n          id: 'a1',\n          kind: 'tool_call',\n          title: 'Write file',\n          risk: 'high',\n          summary: 'writes a file',\n          payloadPreview: '{\"path\":\"/x\"}',\n        }),\n      );\n    });"),
          ])
          patch('src/components/shell/SnapshotRestoreBanner.test.tsx', [
              ("import { render, screen } from '@testing-library/react';", "import { act, render, screen } from '@testing-library/react';"),
              ("    store.dispatch(snapshotRestoreWarned('incompatible'));", "    act(() => {\n      store.dispatch(snapshotRestoreWarned('incompatible'));\n    });"),
              ("    store.dispatch(snapshotRestoreWarned('restore_failed'));", "    act(() => {\n      store.dispatch(snapshotRestoreWarned('restore_failed'));\n    });"),
          ])
          patch('src/components/shell/IndexRedirect.test.tsx', [
              ("import { render, screen } from '@testing-library/react';", "import { act, render, screen } from '@testing-library/react';"),
              ("    store.dispatch(onboardingCompleted());\n    store.dispatch(hydrated());", "    act(() => {\n      store.dispatch(onboardingCompleted());\n      store.dispatch(hydrated());\n    });"),
              ("    store.dispatch(hydrated());", "    act(() => {\n      store.dispatch(hydrated());\n    });"),
          ])

          Path('src/test/setup.ts').write_text("""import '@testing-library/jest-dom/vitest';
          import { afterAll, afterEach, beforeAll } from 'vitest';
          import { cleanup } from '@testing-library/react';

          const originalConsoleError = console.error.bind(console);

          beforeAll(() => {
            console.error = (...args: unknown[]) => {
              const message = args.map((value) => String(value)).join(' ');
              if (message.includes('not wrapped in act')) {
                throw new Error(`React test state update escaped act(): ${message}`);
              }
              originalConsoleError(...args);
            };
          });

          afterEach(() => {
            cleanup();
          });

          afterAll(() => {
            console.error = originalConsoleError;
          });
          """, encoding='utf-8')

          required = {
              'src/screens/ModelsScreen.test.tsx': ['cleanup();'],
              'src/screens/SettingsScreen.test.tsx': ['cleanup();'],
              'src/screens/SecurityScreen.test.tsx': ['cleanup();'],
              'src/screens/ChatScreen.test.tsx': ['act(() =>'],
              'src/components/shell/SnapshotRestoreBanner.test.tsx': ['act(() =>'],
              'src/components/shell/IndexRedirect.test.tsx': ['act(() =>'],
              'src/test/setup.ts': ['React test state update escaped act()'],
          }
          for path, needles in required.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing required postcondition {needle!r}')
          PY
      - name: Format repaired files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/test/setup.ts
            src/screens/ModelsScreen.test.tsx
            src/screens/SettingsScreen.test.tsx
            src/screens/SecurityScreen.test.tsx
            src/screens/ChatScreen.test.tsx
            src/components/shell/SnapshotRestoreBanner.test.tsx
            src/components/shell/IndexRedirect.test.tsx
          )
          pnpm exec prettier --write "${files[@]}"
          pnpm exec prettier --check "${files[@]}"
          git diff --check
      - name: Commit warning policy and repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/test/setup.ts \
            src/screens/ModelsScreen.test.tsx \
            src/screens/SettingsScreen.test.tsx \
            src/screens/SecurityScreen.test.tsx \
            src/screens/ChatScreen.test.tsx \
            src/components/shell/SnapshotRestoreBanner.test.tsx \
            src/components/shell/IndexRedirect.test.tsx
          git commit -m 'test: fail and fix React state-update warnings'
          git push origin HEAD:master
