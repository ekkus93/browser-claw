name: Refresh WASM Bindings Once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-wasm-bindings-once.yml'

permissions:
  contents: write

concurrency:
  group: browserclaw-refresh-wasm-bindings-once
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate and commit WASM bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate committed bindings
        run: pnpm run build:wasm
      - name: Validate generated-file scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test -n "${changed}"
          while IFS= read -r path; do
            case "${path}" in
              src/runtime/wasm/*) ;;
              *)
                echo "Unexpected generated change: ${path}" >&2
                exit 1
                ;;
            esac
          done <<< "${changed}"
          cargo test --workspace
          pnpm run typecheck
      - name: Commit exact generated output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/runtime/wasm
          git commit -m 'build: refresh committed WASM bindings'
          git push origin HEAD:master
