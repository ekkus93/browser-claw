name: Upgrade Certified Actions Once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/upgrade-actions-once.yml'

permissions:
  contents: write

concurrency:
  group: browserclaw-upgrade-actions-once
  cancel-in-progress: false

jobs:
  upgrade:
    name: Upgrade and validate certified actions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - name: Upgrade current action majors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'actions/checkout@v4': 'actions/checkout@v6',
              'actions/setup-node@v4': 'actions/setup-node@v6',
              'actions/setup-go@v5': 'actions/setup-go@v6',
              'pnpm/action-setup@v4': 'pnpm/action-setup@v6',
              'actions/upload-artifact@v4': 'actions/upload-artifact@v7',
          }
          paths = [
              Path('.github/workflows/ci.yml'),
              Path('.github/workflows/pages.yml'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          remaining = []
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old in replacements:
                  if old in text:
                      remaining.append(f'{path}: {old}')
          if remaining:
              raise SystemExit('Action upgrade incomplete: ' + ', '.join(remaining))
          PY
      - name: Validate workflow definitions
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint -color
          git diff --check
      - name: Commit action upgrades
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/ci.yml .github/workflows/pages.yml
          git commit -m 'ci: upgrade certified actions to Node 24 majors'
          git push origin HEAD:master
